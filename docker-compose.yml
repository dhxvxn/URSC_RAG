services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Ollama is used only by the app container. Do not expose it to the LAN.
    ports:
      - "127.0.0.1:11434:11434"

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      DATA_DIR: /data
      EMBEDDING_MODEL_DIR: /models/embeddings/all-MiniLM-L6-v2
      EASYOCR_MODULE_PATH: /models/easyocr
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:7b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      TOP_K_DEFAULT: ${TOP_K_DEFAULT:-6}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-12000}
      PRELOAD_EMBEDDING_MODEL: ${PRELOAD_EMBEDDING_MODEL:-1}
    volumes:
      - rag_data:/data
    ports:
      - "${RAG_BIND_ADDRESS:-127.0.0.1}:8000:8000"

volumes:
  rag_data:
    name: ursc_rag_rag_data
  ollama_models:
    name: ursc_rag_ollama_models
